<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Gyanu Markers — print me</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0}
body{font-family:'Bungee',Impact,sans-serif;background:#ddd}
.tools{font:14px system-ui;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tools input{width:60px;padding:6px}.tools button{padding:8px 14px;font-weight:700}
.page{width:210mm;height:297mm;margin:10px auto;background:#FFD400;position:relative;overflow:hidden;page-break-after:always;border:0}
.band{position:absolute;left:-10%;right:-10%;height:34mm;background:repeating-linear-gradient(90deg,#FF2E88 0 22mm,#15131A 22mm 26mm,#FF2E88 26mm 48mm);transform:rotate(-6deg)}
.b1{top:14mm}.b2{bottom:14mm}
.inner{position:absolute;inset:52mm 14mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#15131A}
.inner img{width:150mm;filter:drop-shadow(3mm 3mm 0 #FF2E88)}
h1{font-size:30mm;line-height:.9;-webkit-text-stroke:1mm #15131A;color:#fff;text-shadow:2mm 2mm 0 #15131A;margin-top:4mm}
p{font-size:8mm;margin-top:3mm}
.id{position:absolute;right:8mm;bottom:52mm;font-size:6mm;background:#15131A;color:#FFD400;padding:2mm 4mm;border-radius:2mm}
@media print{body{background:none}.tools{display:none}.page{margin:0}}
</style>
</head>
<body>
<div class="tools">Print on A4/A3, matte paper. The pink + yellow pattern is what the auto-matcher looks for, so print in colour.
  Copies: <input type="number" id="n" value="3" min="1" max="30"><button onclick="build()">MAKE</button><button onclick="print()">PRINT</button></div>
<div id="pages"></div>
<script>
function build(){const n=+document.getElementById('n').value||1;let h='';for(let i=1;i<=n;i++)h+=`<section class="page"><div class="band b1"></div><div class="band b2"></div><div class="inner"><img src="img/gyanu.svg" alt=""><h1>YOU FOUND<br>GYANU</h1><p>SNAP ME IN GYANU HUNT</p></div><div class="id">#${String(i).padStart(2,'0')}</div></section>`;document.getElementById('pages').innerHTML=h}
build();
</script>
</body>
</html>
